name: Data gap
description: Something is unavailable or unreliable, and it blocks reporting
labels: ["type: data"]
body:
  - type: textarea
    id: gap
    attributes:
      label: What exactly is unavailable or unreliable
    validations:
      required: true

  - type: textarea
    id: blocks
    attributes:
      label: Which reports and metrics it blocks
    validations:
      required: true

  - type: dropdown
    id: closes
    attributes:
      label: What will close it
      options:
        - New data source
        - Change in the accounting system
        - Investigating a discrepancy
        - Not clear yet
    validations:
      required: true

  - type: input
    id: owner
    attributes:
      label: Owner on the Accent side
      description: Who is responsible for getting this gap closed
    validations:
      required: true

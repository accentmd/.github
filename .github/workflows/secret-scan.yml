name: Secret scan (reusable)
# gitleaks over the full git history of the calling repository. A repository-specific allowlist, if any,
# lives in the caller's .gitleaks.toml (gitleaks picks it up from the repository root).
on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON runner labels.
        type: string
        default: '["ubuntu-24.04"]'

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git /repo --redact --no-banner --exit-code 1

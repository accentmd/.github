name: Self CI
# Checks this repository's own workflows and YAML. GitHub-hosted runners only: this repository is public,
# so it must never run on the self-hosted runners (AGENTS.md rule 5).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: self-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  ZIZMOR_VERSION: 1.30.1
  YAMLLINT_VERSION: 1.38.0

jobs:
  lint:
    name: Lint workflows and YAML
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: actionlint (with shellcheck on run steps)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color .github/workflows/*.yml workflow-templates/*.yml
      - name: zizmor (workflow security)
        run: uvx "zizmor==${ZIZMOR_VERSION}" --persona=regular .github/workflows workflow-templates
      - name: yamllint
        run: uvx "yamllint==${YAMLLINT_VERSION}" --strict .

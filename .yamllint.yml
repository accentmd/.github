extends: default
rules:
  document-start: disable
  line-length:
    max: 160
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  trailing-spaces:
    ignore:
      # Empty checklist items ("- [ ] ") in issue-form defaults keep their space on purpose.
      - .github/ISSUE_TEMPLATE/
